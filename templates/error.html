{% extends "auth_base.html" %}
{% block title %}{{ code }} | {{ app_name }}{% endblock %}
{% block auth_body %}
<div class="auth-copy"></div>
<section class="auth-card" aria-labelledby="err-h">
  <h1 id="err-h">{{ code }}</h1>
  <p class="sub">{{ message }}</p>
  <a class="btn btn-primary btn-block" href="{{ url_for('index') }}">Back to {{ app_name }}</a>
</section>
{% endblock %}
